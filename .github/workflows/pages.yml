name: Pages
run-name: "Pages: ${{ github.event.head_commit.message || github.event_name }}"

# Test, stamp the version (commit time in JST, YYYY.MM.DD.HHMM) and publish to GitHub Pages.
# Settings → Pages → Build and deployment → Source must be "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Write version.json
        env:
          TZ: Asia/Tokyo
        run: |
          version=$(git log -1 --date=format-local:%Y.%m.%d.%H%M --format=%cd)
          printf '{"version":"%s","commit":"%s","repo":"%s"}\n' "$version" "$GITHUB_SHA" "$GITHUB_REPOSITORY" > version.json
          cat version.json

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html editor.html version.json css js vendor words tables keyboards LICENSE _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
